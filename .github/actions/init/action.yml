name: Init
description: Sets up the environment for build, lint, and test jobs

inputs:
  python-version:
    description: Python minor version to install
    required: false
    default: "3.14"
  save-cache:
    description: Whether to save the uv cache after the job
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6.2.0
      id: python
      with:
        python-version: ${{ inputs.python-version }}

    - name: Select the interpreter for uv
      shell: sh
      env:
        PYTHON_PATH: ${{ steps.python.outputs.python-path }}
      run: printf "UV_PYTHON=%s\n" "$PYTHON_PATH" >> "$GITHUB_ENV"

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true
        save-cache: ${{ inputs.save-cache }}
        cache-dependency-glob: |
          **/pyproject.toml
          **/uv.lock

    - name: Install dependencies
      shell: sh
      run: uv sync --locked --dev
