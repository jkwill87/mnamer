name: Test
description: Runs deterministic tests and optional live provider tests

inputs:
  network:
    description: Whether to run the live provider test target
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Running Deterministic Tests
      run: mise test
      shell: sh

    - name: Running Live Provider Tests
      if: inputs.network == 'true'
      run: mise run rust:test:net
      shell: sh
