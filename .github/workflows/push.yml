name: push

on:
  push:
    branches:
      - main
      - v3
    tags:
      - "v*.*.*"
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      network:
        description: Run live provider tests
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/init
      - uses: ./.github/actions/lint

  test:
    runs-on: ubuntu-latest
    env:
      API_KEY_OMDB: ${{ secrets.API_KEY_OMDB }}
      API_KEY_TMDB: ${{ secrets.API_KEY_TMDB }}
      API_KEY_TVDB: ${{ secrets.API_KEY_TVDB }}

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/init
      - uses: ./.github/actions/test
        with:
          network: ${{ github.event_name == 'schedule' || inputs.network }}

  publish:
    if: >-
      success()
      && github.event_name == 'push'
      && (
        github.ref == 'refs/heads/main'
        ||
        github.ref == 'refs/heads/v3'
        || startsWith(github.ref, 'refs/tags/v')
      )
    needs:
      - lint
      - test
    permissions:
      contents: read
    secrets:
      inherit
    uses: ./.github/workflows/publish.yml
