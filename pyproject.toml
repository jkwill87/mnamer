[project]
name = "mnamer"
description = "A command-line utility for organizing media files."
authors = [{ name = "Jessy Williams", email = "jessy@jessywilliams.com" }]
maintainers = [{ name = "Jessy Williams", email = "jessy@jessywilliams.com" }]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
dynamic = ["version"]
scripts = { mnamer = "mnamer.__main__:main" }
urls = { repository = "https://github.com/jkwill87/mnamer" }
readme = "README.md"
dependencies = [
    "appdirs~=1.4.4",
    "babelfish~=0.6.1",
    "certifi>=2026.10.18",
    "guessit~=4.5.5",
    "requests>=2.33.1,<2.35.0",
    "requests-cache~=1.3.2",
    "setuptools>=84.1.0",
    "setuptools-scm>=10.0.0",
    "teletype~=1.3.4",
    "urllib3>=2.8.0",
]


[tool.setuptools]
packages = ["mnamer"]

[tool.setuptools.package-data]
"*" = ["LICENSE.txt", "README.md", "py.typed"]

[build-system]
requires = ["setuptools >= 84.1.0", "setuptools-scm >= 10.2", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "appdirs-stubs~=0.2.0",
    "build>=1.2.0",
    "codecov~=2.1.13",
    "mypy>=2.0",
    "pylint>=4.0.9",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15.1",
    "pytest-rerunfailures>=16.0",
    "pytest>=9.0",
    "ruff>=0.15.12,<0.18.0",
    "setuptools>=84.1.0",
    "twine>=6.0.0",
    "types-requests~=2.33.0",
    "wheel>=0.45.0",
]

[tool.uv]
# Twine can pull in cryptography through keyring on Linux.
constraint-dependencies = ["cryptography>=50.0.0"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "C901", # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
include = ["mnamer"]
exclude = ["playground.py", ".venv", "venv", "build", "dist"]
venvPath = "."
venv = ".venv"
reportAny = false
reportExplicitAny = false
reportGeneralTypeIssues = "information"
reportIgnoreCommentWithoutRule = false
reportImplicitStringConcatenation = false
reportMissingParameterType = false
reportMissingTypeStubs = false
reportPrivateLocalImportUsage = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnusedCallResult = false
reportUnusedParameter = false

[tool.ruff.lint.isort]
known-first-party = ["mnamer"]
combine-as-imports = true

[tool.pylint.messages_control]
max-line-length = 88
disable = ["C0103", "C0114", "C0116", "C0209", "E0401", "R0801"]

[tool.mypy]
incremental = false
python_version = "3.13"

[tool.setuptools_scm]
local_scheme = "dirty-tag"
write_to_source = true
version_file = "mnamer/__version__.py"
version_file_template = '''# file generated by setuptools_scm
# don't change, don't track in version control

__version__ = "{version}"
'''
